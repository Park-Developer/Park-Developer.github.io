<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            padding: 24px 32px;
            box-sizing: border-box;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        code {
            background: #f4f4f4;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        blockquote {
            border-left: 4px solid #ccc;
            margin: 0;
            padding-left: 16px;
            color: #666;
        }
        dd {
            margin-left: 0;
        }
    </style>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

<body>
    <h3><em>Overview</em></h3>
<hr />
<dl>
<dd>깃에서 각 커밋에 달 수 있는 꼬리표 같은 것으로서, 주로 릴리즈 버전을 표시하는데에 이용된다.  태그 여부와 이름에 따라 어떤 버전이 중요한 버전인지 확인할 수 있다.</dd>
</dl>
<ul>
<li>커밋을 한 시점 참조가 필요할 때 알기 쉽도록 이름을 붙이는 것</li>
<li>한 번 붙인 태그는 브랜치처럼 위치가 이동하지 않고 고정</li>
</ul>
<h3><em>Tag 종류</em></h3>
<hr />
<ul>
<li>lightweight : 이름만 붙이는 일반 태그</li>
<li>annotated : 주석 태그, 정보 포함 가능</li>
<li></li>
</ul>
