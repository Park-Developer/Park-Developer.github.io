- 터미널, IDE, 데스크톱 앱 및 브라우저에서 사용이 가능하다.
- Claude에게 작업을 주면 세 가지 단계를 거칩니다: <strong>컨텍스트 수집</strong>, <strong>작업 수행</strong>, <strong>결과 검증</strong>. 이 단계들은 함께 진행됩니다. Claude는 파일을 검색하여 코드를 이해하든, 변경을 위해 편집하든, 작업을 확인하기 위해 테스트를 실행하든 전체적으로 도구를 사용합니다.
