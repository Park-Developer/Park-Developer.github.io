    <h3><em>MIPI(Mobile Industrial Processor Interface)</em></h3>
<hr />
<p>: MIPI Alliance에서 개발한 표준화된 인터페이스 세트로, 모바일 기기의 내장 프로세서에 주변 장치와 센서를 연결하기 위해 개발됐다.</p>
<p>이 인터페이스는 저전력, 고속, 유연성을 고려하여 설계되어 스마트폰이나 태블릿과 같은 모바일 기기에 이상적이다. 또한 모바일 기기와 전자 기기 부품 간의 고속 데이터 전송을 용이하게 하도록 설계됐다.</p>
