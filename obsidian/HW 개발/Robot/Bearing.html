<p>: 회전하고 있는 설비의 축을 일정한 위치에 고정시키고 축의 하중을 지지하면서 축을 회전시키는 역할을 하는 기계 부품</p>
<p>베이링과 맞닿는 부분을 저널이라고 하며, 이 접촉 상태에 따라 구름베어링(Rolling Bearing)과 미끄럼 베어링(Sliding Bearing)으로 나눠진다.</p>
