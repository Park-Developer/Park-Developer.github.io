    <h3>OTP(One-Time Programmable)</h3>
<hr />
<p>: OTP 메모리는 단 한 번만 프로그래밍할 수 있는 특수한 유형의 비휘발성 메모리이다.</p>
<ul>
<li>OTP 메모리는 딱 한번만 프로그래밍할 수 있다.</li>
<li>프로그램된 후에는 저장된 데이터를 변경할 수 없기 때문에, 하드웨어 신뢰의 기본 요소로 사용된다.</li>
