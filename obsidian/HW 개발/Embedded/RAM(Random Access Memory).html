    <h3><em>RAM(Random Access Memory)</em></h3>
<hr />
<p>: 컴퓨터의 주기억장치인 RAM은, 컴퓨터가 켜져 있을 때만 사용하고 컴퓨타의 전원이 끊어지면 기록된 정보가 사라지는 휘발성 메모리라는 뜻이다.</p>
<ul>
<li>응용프로그램의 일시적 로딩, 데이터의 일시적 저장 등에 사용된다.</li>
<li>CPU와 HDD 또는 SDD 등을 이어주는 또 하나의 데이터 기억 장치이다.
<img src="../../HW 개발/Archieve/Attachment/Pasted image 20260708001531.png" alt="Pasted image 20260708001531.png" width="415"></li>
</ul>
