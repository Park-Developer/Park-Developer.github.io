<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDB</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        code {
            background: #f4f4f4;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        blockquote {
            border-left: 4px solid #ccc;
            margin: 0;
            padding-left: 16px;
            color: #666;
        }
    </style>

<body>
    <h3><em>Concept</em></h3>
<hr />
<p>: GDB(GNU Debugger)는 C, C++, 어셈블리어 수준의 디버깅을 지원하는 도구이다.</p>
<h3><em>Features</em></h3>
<hr />
<ul>
<li>브레이크 포인트 설정</li>
<li>단계별 실행(Step by Step Execution)</li>
<li>메모리 및 변수 검사 : 변수값, 레지스터, 스택 상태 확인</li>
<li>어셈블리 코드 디버깅 : 저수준에서 명령어 단위로 코드 실행 추적</li>
<li>코어 덤프 분석 : 비정상 종료된 프로그램의 상태 확인</li>
</ul>
</body>
</html>
