    <h3><em>BSP(Board Support Package)</em></h3>
<hr />
<p>: SoC 벤더에서 제품 제조사 개발자에게 전달하는 소스와 개발 패키지를 의미한다.</p>
<p>주로 '부트로더 + 커널 디바이스(SoC를 구동하는 드라이버) + 리눅스 커널 + 컴파일러 + HAL'를 포함한다.</p>
<p>SoC 벤더(엔비디아, 퀄컴)가 BSP 코드를 제조사에게 배포하는 이유는, 제조사 개발자들이 SoC의 세세한 동작을 모르기 때문이 SoC에 특화된 하드웨어를 초기화하는 코드를 살리는 브링업을 진행하기 어렵기 때문입니다. 그래서 자신의 SoC가 기본 동작하는 코드를 전달하는 것이죠.</p>
