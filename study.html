    .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;

        border-left: 2px solid #22d3ee; /* Primary Cyan */

    /* Resizer */
    .resizer {
        width: 4px;
        cursor: col-resize;
        transition: background-color 0.3s;
        z-index: 10;
    }
    .resizer:hover, .resizer.resizing {
        background-color: #006877; /* primary */
    }

    /* Scrollbar */
    .tree-container::-webkit-scrollbar {
        width: 6px;
    }
    .tree-container::-webkit-scrollbar-thumb {
        background: #bbc9cd;
        border-radius: 4px;
    }
    .dark .tree-container::-webkit-scrollbar-thumb {
        background: #6c797d;
    }
</style>

<div class="flex items-center gap-xl w-full">

<div class="hidden md:flex gap-md flex-1">

<a class="text-on-surface-variant hover:text-primary-fixed-dim transition-colors duration-200 cursor-pointer transition-all active:scale-95" href="blog.html">Blog</a>
<a class="text-on-surface-variant hover:text-primary-fixed-dim transition-colors duration-200 cursor-pointer transition-all active:scale-95" href="projects.html">Projects</a>
<a class="text-primary border-b-2 border-primary pb-1 hover:text-primary-fixed-dim transition-colors duration-200 cursor-pointer transition-all active:scale-95" href="study.html">Study</a>

<div class="flex items-center gap-sm">
<button id="theme-toggle" class="text-primary hover:text-primary-fixed-dim transition-colors duration-200 cursor-pointer transition-all active:scale-95 flex items-center justify-center p-2 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
<div class="relative hidden sm:block">
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="search">search</span>
</div>
<input id="tree-search" class="bg-surface-container-lowest border border-surface-border text-on-surface text-sm rounded-lg focus:ring-primary-container focus:border-primary-container block w-full pr-10 p-2.5 focus:shadow-[0_0_0_2px_rgba(34,211,238,0.2)] transition-all" placeholder="Search notes..." type="text"/>
</div>
</div>

<!-- Main Content Area - Split Pane Layout -->
<div class="flex-1 flex pt-16 h-full max-w-container-max mx-auto w-full">
    
    <!-- Left Pane: Directory Tree Sidebar -->
    <aside id="sidebar" class="w-72 bg-surface-container-low border-r border-outline-variant hidden md:flex flex-col h-full overflow-y-auto">
        <div class="p-md pb-4 sticky top-0 bg-surface-container-low z-10 border-b border-surface-border/50">
            <h2 class="font-headline-md text-headline-md text-primary font-semibold">Directory</h2>
        </div>
        <div id="tree-container" class="flex-1 p-sm space-y-1 tree-container">
            <!-- Tree loaded by JS -->
        </div>
    </aside>

    <!-- Resizer -->
    <div class="resizer hidden md:block" id="resizer"></div>

    <!-- Right Pane: Content Reading Area -->
    <main class="flex-1 bg-surface-container-lowest h-full overflow-y-auto relative flex flex-col">
        <!-- Optional Breadcrumbs if we want to show path -->
        <nav aria-label="Breadcrumb" class="hidden text-sm text-text-secondary px-6 pt-8 md:px-12 lg:px-16 pb-4" id="breadcrumb-container">
            <ol class="inline-flex items-center space-x-1 md:space-x-3" id="breadcrumb-list">
                <li class="inline-flex items-center">
                    <span class="inline-flex items-center text-text-secondary">
                        <span class="material-symbols-outlined text-[16px] mr-1" data-icon="home">home</span>
                        Study
                    </span>
                </li>
                <!-- Dynamic breadcrumbs -->
            </ol>
        </nav>
        
        <iframe id="content-iframe" src="about:blank" title="Study Content" class="w-full h-full flex-1 border-none bg-surface-container-lowest"></iframe>
    </main>
</div>

<script>
    
    // Theme toggle logic
    (function() {
        const themeToggle = document.getElementById('theme-toggle');
        if (!themeToggle) return;
        const themeIcon = themeToggle.tagName.toLowerCase() === 'span' ? themeToggle : themeToggle.querySelector('span');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            if (themeIcon) themeIcon.textContent = 'light_mode';
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                if (themeIcon) themeIcon.textContent = 'dark_mode';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                if (themeIcon) themeIcon.textContent = 'light_mode';
                localStorage.setItem('theme', 'dark');
            }
        });
    })();
// Study App Logic
    document.addEventListener('DOMContentLoaded', () => {
        const treeContainer = document.getElementById('tree-container');
        const iframe = document.getElementById('content-iframe');
        const searchInput = document.getElementById('tree-search');
        let activeElement = null;

        fetch('obsidian/tree.json')
            .then(response => response.json())
            .then(data => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tree-root space-y-1';
                buildTree(data, wrapper);
                treeContainer.appendChild(wrapper);
            })
            .catch(err => {
                treeContainer.innerHTML = '<p class="text-center text-text-secondary mt-4">Failed to load documents.</p>';
                console.error('Failed to load tree:', err);
            });

        function buildTree(items, container) {
            items.forEach(item => {
                if (item.type === 'directory') {
                    // Folder wrapper
                    const folderDiv = document.createElement('div');
                    folderDiv.className = 'tree-folder';
                    
                    // Folder button
                    const btn = document.createElement('button');
                    btn.className = 'w-full flex items-center justify-between p-2 hover:bg-surface-variant rounded-lg transition-colors cursor-pointer text-on-surface-variant group';
                    
                    const leftDiv = document.createElement('div');
                    leftDiv.className = 'flex items-center gap-2';
                    
                    const icon = document.createElement('span');
                    icon.className = 'material-symbols-outlined text-[20px] text-outline transition-transform group-hover:text-primary-container';
                    icon.textContent = 'folder';
                    
                    const text = document.createElement('span');
                    text.className = 'font-body-md text-body-md font-medium';
                    text.textContent = item.name;
                    
                    leftDiv.appendChild(icon);
                    leftDiv.appendChild(text);
                    
                    const arrowIcon = document.createElement('span');
                    arrowIcon.className = 'material-symbols-outlined text-[18px] text-outline transition-transform group-hover:text-primary';
                    arrowIcon.textContent = 'chevron_right';
                    
                    btn.appendChild(leftDiv);
                    btn.appendChild(arrowIcon);
                    
                    folderDiv.appendChild(btn);

                    // Subfolder container
                    const subContainer = document.createElement('div');
                    subContainer.className = 'ml-4 border-l border-surface-border pl-2 mt-1 space-y-1 hidden tree-subcontainer';
                    
                    buildTree(item.children, subContainer);
                    folderDiv.appendChild(subContainer);
                    
                    // Toggle Logic
                    btn.addEventListener('click', () => {
                        const isHidden = subContainer.classList.contains('hidden');
                        if (isHidden) {
                            subContainer.classList.remove('hidden');
                            icon.textContent = 'folder_open';
                            icon.classList.replace('text-outline', 'text-primary-container');
                            btn.classList.add('text-primary');
                            arrowIcon.classList.add('rotate-90');
                        } else {
                            subContainer.classList.add('hidden');
                            icon.textContent = 'folder';
                            icon.classList.replace('text-primary-container', 'text-outline');
                            btn.classList.remove('text-primary');
                            arrowIcon.classList.remove('rotate-90');
                        }
                    });
                    
                    container.appendChild(folderDiv);
                } else {
                    // File link
                    const a = document.createElement('a');
                    a.className = 'tree-file flex items-center gap-2 p-2 hover:bg-surface-variant rounded-lg transition-colors cursor-pointer group';
                    
                    const icon = document.createElement('span');
                    icon.className = 'material-symbols-outlined text-[18px] text-outline group-hover:text-primary-container file-icon';
                    icon.textContent = 'description';
                    
                    const text = document.createElement('span');
                    text.className = 'font-body-md text-sm text-on-surface-variant file-text';
                    text.textContent = item.name;
                    
                    a.appendChild(icon);
                    a.appendChild(text);
                    
                    a.addEventListener('click', () => {
                        if (activeElement) {
                            activeElement.className = 'tree-file flex items-center gap-2 p-2 hover:bg-surface-variant rounded-lg transition-colors cursor-pointer group';
                            const prevIcon = activeElement.querySelector('.file-icon');
                            prevIcon.className = 'material-symbols-outlined text-[18px] text-outline group-hover:text-primary-container file-icon';
                            const prevText = activeElement.querySelector('.file-text');
                            prevText.className = 'font-body-md text-sm text-on-surface-variant file-text';
                        }
                        
                        a.className = 'tree-file flex items-center gap-2 p-2 bg-secondary-container text-on-secondary-container rounded-lg transition-colors cursor-pointer font-bold border border-primary-container/30';
                        icon.className = 'material-symbols-outlined text-[18px] text-primary-container file-icon';
                        text.className = 'font-body-md text-sm file-text';
                        
                        activeElement = a;
                        iframe.src = 'obsidian/' + item.path + '?v=' + new Date().getTime();
                    });
                    
                    container.appendChild(a);
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const root = treeContainer.querySelector('.tree-root');
            if (root) filterTree(root, term);
        });

        function filterTree(container, term) {
            let hasVisibleChild = false;
            const children = container.children;
            
            for (let i = 0; i < children.length; i++) {
                const el = children[i];
                if (el.classList.contains('tree-folder')) {
                    const btn = el.querySelector('button');
                    const text = btn.querySelector('.font-body-md').textContent.toLowerCase();
                    const subContainer = el.querySelector('.tree-subcontainer');
                    const icon = btn.querySelector('.material-symbols-outlined');
                    const arrowIcon = btn.querySelectorAll('.material-symbols-outlined')[1];
                    
                    let match = text.includes(term);
                    const childMatch = filterTree(subContainer, term);
                    
                    if (childMatch || match) {
                        el.style.display = '';
                        hasVisibleChild = true;
                        
                        // Auto-expand if searching
                        if (term !== '' && subContainer.classList.contains('hidden')) {
                            subContainer.classList.remove('hidden');
                            icon.textContent = 'folder_open';
                            icon.classList.replace('text-outline', 'text-primary-container');
                            btn.classList.add('text-primary');
                            arrowIcon.classList.add('rotate-90');
                        } else if (term === '' && !subContainer.classList.contains('hidden')) {
                            // Optionally auto-collapse when search cleared
                            subContainer.classList.add('hidden');
                            icon.textContent = 'folder';
                            icon.classList.replace('text-primary-container', 'text-outline');
                            btn.classList.remove('text-primary');
                            arrowIcon.classList.remove('rotate-90');
                        }
                    } else {
                        el.style.display = 'none';
                    }
                } else if (el.classList.contains('tree-file')) {
                    const text = el.querySelector('.file-text').textContent.toLowerCase();
                    if (text.includes(term)) {
                        el.style.display = '';
                        hasVisibleChild = true;
                    } else {
                        el.style.display = 'none';
                    }
                }
            }
            return hasVisibleChild;
        }

        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            resizer.classList.add('resizing');
            iframe.style.pointerEvents = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 200 && newWidth < document.body.offsetWidth - 300) {
                sidebar.style.width = `${newWidth}px`;
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                resizer.classList.remove('resizing');
                iframe.style.pointerEvents = 'auto';
            }
        });

        iframe.addEventListener('load', function() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                if (iframeDoc && iframeDoc.body) {
                    iframeDoc.body.style.padding = '24px 32px';
                    iframeDoc.body.style.fontFamily = "'Inter', sans-serif";
                    if(document.documentElement.classList.contains('dark')){
                        iframeDoc.body.style.backgroundColor = "#ffffff";
                    }
                }
            } catch (e) {
                console.error("Cannot access iframe content:", e);
            }
        });
    });
</script>
