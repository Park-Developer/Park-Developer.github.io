<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study - Developer Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific styles for Study Layout */
        body {
            /* Prevent full body scroll to keep the header and layout fixed */
            overflow: hidden;
        }

        .study-layout {
            display: flex;
            height: 100vh;
            padding: 100px 3% 20px 3%; /* Space for fixed header */
        }

        .resizer {
            width: 8px;
            margin: 0 10px;
            cursor: col-resize;
            background-color: transparent;
            transition: background-color 0.3s;
            border-radius: 4px;
            z-index: 10;
        }

        .resizer:hover, .resizer.resizing {
            background-color: var(--main-color);
        }

        .sidebar {
            flex: 0 0 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
        }
        
        /* Tree Container scroll settings */
        .tree-container {
            flex: 1;
            overflow-y: auto;
        }
        
        /* Scrollbar styles for tree container */
        .tree-container::-webkit-scrollbar {
            width: 8px;
        }
        .tree-container::-webkit-scrollbar-thumb {
            background: var(--main-color);
            border-radius: 4px;
        }

        .content-viewer {
            flex: 1;
            min-height: 0;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        #content-iframe {
            width: 100%;
            height: 100%;
            flex: 1;
            border: none;
            background: #fff;
            transition: 0.3s ease;
        }
        
        [data-theme="dark"] #content-iframe {
            /* If the html pages themselves don't support dark mode natively, a white background iframe might be jarring, 
               but we can set a fallback background */
            background: #fff; /* kept white to ensure markdown HTML renders legibly if it doesn't have dark mode styles */
        }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-color);
            opacity: 0.7;
            font-size: 1.2rem;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s ease;
        }
        
        [data-theme="dark"] .search-container input {
            background: rgba(30, 41, 59, 0.5);
        }

        .search-container input:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.2);
        }

        /* Tree Styles */
        .tree-ul {
            list-style: none;
            padding-left: 20px;
            margin: 5px 0;
        }

        .tree-root {
            padding-left: 0;
        }

        .tree-li {
            margin: 5px 0;
        }

        .tree-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 12px;
            transition: 0.3s ease;
            font-size: 1rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .tree-item:hover {
            background: rgba(79, 70, 229, 0.1); /* Subtle main color bg */
            transform: translateX(5px);
        }

        .tree-item i {
            margin-right: 12px;
            font-size: 1.4rem;
            color: var(--main-color);
            transition: 0.3s ease;
        }

        .tree-item.active {
            background: var(--main-color);
            color: #fff;
        }
        .tree-item.active i {
            color: #fff;
        }
        
        @media (max-width: 991px) {
            .study-layout {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
                padding-top: 120px;
                padding-bottom: 50px;
            }
            body {
                overflow-y: auto;
            }
            .sidebar {
                flex: none;
                height: 300px;
            }
            .content-viewer {
                height: 600px;
                flex: none;
            }
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header class="header">
        <a href="index.html" class="logo">Dev<span>.</span></a>
        
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="projects.html">Projects</a>
            <a href="study.html" class="active">Study</a>
            <a href="now.html">Now</a>
        </nav>

        <div class="header-actions">
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                <i class='bx bx-moon'></i>
            </button>
            <div id="menu-icon" class="menu-icon"><i class='bx bx-menu'></i></div>
        </div>
    </header>

    <main class="study-layout fade-in">
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="search-container">
                <i class='bx bx-search'></i>
                <input type="text" id="tree-search" placeholder="Search files...">
            </div>
            
            <div class="tree-container" id="tree-container">
                <!-- Tree items will be dynamically generated here -->
            </div>
        </aside>
        
        <div class="resizer" id="resizer"></div>
        
        <section class="content-viewer glass-panel">
            <iframe id="content-iframe" src="about:blank" title="Study Content"></iframe>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-text">
            <p>&copy; 2024 Wonho. All Rights Reserved.</p>
        </div>
        <div class="footer-iconTop">
            <a href="#"><i class='bx bx-up-arrow-alt'></i></a>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const treeContainer = document.getElementById('tree-container');
            const iframe = document.getElementById('content-iframe');
            const searchInput = document.getElementById('tree-search');
            let activeElement = null;

            // Fetch the generated tree.json
            fetch('obsidian/tree.json')
                .then(response => response.json())
                .then(data => {
                    const ul = buildTree(data, true);
                    treeContainer.appendChild(ul);
                })
                .catch(err => {
                    treeContainer.innerHTML = '<p style="text-align:center; margin-top: 20px;">문서를 불러오지 못했습니다.</p>';
                    console.error('Failed to load tree:', err);
                });

            function buildTree(items, isRoot = false) {
                const ul = document.createElement('ul');
                ul.className = isRoot ? 'tree-ul tree-root' : 'tree-ul';
                
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'tree-li';
                    
                    const div = document.createElement('div');
                    div.className = 'tree-item';
                    
                    const icon = document.createElement('i');
                    if (item.type === 'directory') {
                        icon.className = 'bx bx-folder';
                    } else {
                        icon.className = 'bx bx-file';
                    }
                    
                    const text = document.createElement('span');
                    text.textContent = item.name;
                    
                    div.appendChild(icon);
                    div.appendChild(text);
                    
                    li.appendChild(div);
                    
                    if (item.type === 'directory') {
                        const childrenUl = buildTree(item.children);
                        childrenUl.style.display = 'none'; // Initially collapsed
                        
                        div.addEventListener('click', () => {
                            if (childrenUl.style.display === 'none') {
                                childrenUl.style.display = 'block';
                                icon.className = 'bx bx-folder-open';
                            } else {
                                childrenUl.style.display = 'none';
                                icon.className = 'bx bx-folder';
                            }
                        });
                        li.appendChild(childrenUl);
                    } else {
                        div.addEventListener('click', () => {
                            if (activeElement) {
                                activeElement.classList.remove('active');
                            }
                            div.classList.add('active');
                            activeElement = div;
                            
                            // Load html file in iframe with cache-busting to bypass browser cache
                            iframe.src = 'obsidian/' + item.path + '?v=' + new Date().getTime();
                        });
                    }
                    
                    ul.appendChild(li);
                });
                return ul;
            }

            // Search logic
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const rootUl = treeContainer.querySelector('.tree-root');
                if (rootUl) {
                    filterTree(rootUl, term);
                }
            });

            function filterTree(ul, term) {
                let hasVisibleChild = false;
                const lis = ul.children;
                for (let i = 0; i < lis.length; i++) {
                    const li = lis[i];
                    const div = li.querySelector('.tree-item');
                    const text = div.querySelector('span').textContent.toLowerCase();
                    const icon = div.querySelector('i');
                    const isDir = icon.classList.contains('bx-folder') || icon.classList.contains('bx-folder-open');
                    
                    let match = text.includes(term);
                    
                    if (isDir) {
                        const childUl = li.querySelector('.tree-ul');
                        const childMatch = filterTree(childUl, term);
                        
                        if (childMatch || match) {
                            li.style.display = '';
                            hasVisibleChild = true;
                            
                            // Auto-expand if searching and not empty
                            if (term !== '' && childUl.style.display === 'none') {
                                childUl.style.display = 'block';
                                icon.className = 'bx bx-folder-open';
                            } else if (term === '') {
                                // Collapse when search is cleared
                                childUl.style.display = 'none';
                                icon.className = 'bx bx-folder';
                            }
                        } else {
                            li.style.display = 'none';
                        }
                    } else {
                        if (match) {
                            li.style.display = '';
                            hasVisibleChild = true;
                        } else {
                            li.style.display = 'none';
                        }
                    }
                }
                return hasVisibleChild;
            }

            // Resizer Logic
            const sidebar = document.getElementById('sidebar');
            const resizer = document.getElementById('resizer');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                resizer.classList.add('resizing');
                iframe.style.pointerEvents = 'none'; // Prevent iframe from capturing mouse
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                // Calculate width based on mouse position
                const newWidth = e.clientX - sidebar.getBoundingClientRect().left;
                if (newWidth > 200 && newWidth < document.body.offsetWidth - 300) {
                    sidebar.style.flex = `0 0 ${newWidth}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    resizer.classList.remove('resizing');
                    iframe.style.pointerEvents = 'auto';
                }
            });

            // Remove iframe padding dynamically
            iframe.addEventListener('load', function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.body) {
                        // 기본적으로 너무 넓었던 여백을 보기 편한 적당한 크기로 조정
                        iframeDoc.body.style.padding = '16px 24px';
                        iframeDoc.body.style.margin = '0';
                    }
                } catch (e) {
                    console.error("Cannot access iframe content to remove padding:", e);
                }
            });
        });
    </script>
</body>
</html>
